name: Fetch backgrounds

# One-off helper: downloads photos on the GitHub runner, converts them to
# 1080x1920 WebP plus a 270x480 thumbnail, and commits them to the branch
# the workflow was dispatched on.
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: 'JSON object mapping background id to a source image URL'
        required: true
        type: string

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp jq >/dev/null
      - name: Download and convert
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          mkdir -p packages/assets/backgrounds/thumbs
          echo "$MANIFEST" | jq -r 'to_entries[] | "\(.key) \(.value)"' | while read -r id url; do
            [[ "$id" =~ ^[a-z0-9-]+$ ]] || { echo "bad id: $id"; exit 1; }
            curl -fsSL "$url" -o "/tmp/$id.src"
            convert "/tmp/$id.src" -auto-orient -resize 1080x1920^ -gravity center -extent 1080x1920 -strip -quality 82 "packages/assets/backgrounds/$id.webp"
            convert "/tmp/$id.src" -auto-orient -resize 270x480^ -gravity center -extent 270x480 -strip -quality 70 "packages/assets/backgrounds/thumbs/$id.webp"
            echo "ok $id"
          done
          ls -la packages/assets/backgrounds packages/assets/backgrounds/thumbs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/assets/backgrounds
          git commit -m "Add photo backgrounds" || { echo "nothing to commit"; exit 0; }
          git push
